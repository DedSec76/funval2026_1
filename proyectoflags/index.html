<!doctype html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="./src/style.css" rel="stylesheet" />
    <script type="module" src="./src/js/script.js"></script>
    <script type="module" src="./src/js/banderas.js"></script>
    <title>Banderas del Mundo</title>
</head>

<body>
    <!-- Header -->
    <header class="dark:bg-[#2b3743] dark:text-white">
        <nav class="h-25 flex items-center justify-between px-5 shadow">
            <p class="font-bold">Where in the world?</p>
            <button id="darkMode" class="px-1.5 py-0.5 rounded-md cursor-pointer bg-blue-500 text-white">🌙 Dark Mode</button>
        </nav>
    </header>
    
    <!-- MAIN -->
    <main class="bg-gray-100 dark:bg-[#212e37] pt-5 px-5 pb-16">
        <section class="flex flex-col gap-4 mb-5">
            <input class="bg-white dark:bg-[#2b3743] dark:text-white px-7 py-5 shadow" type="text" placeholder="🔍 Search for a country...">
            <select class="bg-white dark:bg-[#2b3743] dark:text-white w-62.5 px-8 py-4 shadow" 
                    name="" 
                    id="selectRegion">
                
                
            </select>
        </section>

        <!-- tarjeta de banderas -->
        <section id="contenedorFlags" class="max-w-400 mx-auto grid grid-cols-2 items-center gap-8 md:grid-cols-4 lg:grid-cols-6">
            
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="dark:bg-[#2b3743] dark:text-white"">
        
    </footer>
</body>
</html>
